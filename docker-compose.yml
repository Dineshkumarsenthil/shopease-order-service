services:
  order-db:
    image: mysql:8.0
    container_name: shopease-order-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: shopease_order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
    ports:
      - "3309:3306"
    volumes:
      - order_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  order-service:
    build: .
    container_name: shopease-order-service
    restart: unless-stopped
    env_file: .env
    environment:
      # Connect to MySQL through the Compose service name
      DATABASE_URL: mysql+pymysql://order_user:order_pass@order-db:3306/shopease_order_db
      # The other services run in their own Compose projects, so reach them via the host's published ports
      USER_SERVICE_URL: http://host.docker.internal:8002
      PRODUCT_SERVICE_URL: http://host.docker.internal:8003
    ports:
      - "8004:8004"
    depends_on:
      order-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  order_db_data:
